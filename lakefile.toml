name = "UnicodeData"
precompileModules = true
testDriver = "testTables"
description = "Unicode Character Database support for Lean 4"
keywords = ["unicode"]
defaultTargets = ["UnicodeData"]

[[require]]
name = "Batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "main"

[[require]]
name = "UnicodeBasic"
git = "https://github.com/fgdorais/lean4-unicode-basic"
rev = "data-split"

[[lean_lib]]
name = "UnicodeData"

[[lean_exe]]
name = "MakeTables"
exeName = "make-tables"

[[lean_exe]]
name = "makeCLib"

[[lean_exe]]
name = "testTables"
